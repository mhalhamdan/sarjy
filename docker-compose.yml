services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarjy
      POSTGRES_DB: sarjy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarjy -d sarjy"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sarjy:${POSTGRES_PASSWORD}@db:5432/sarjy
    depends_on:
      db:
        condition: service_healthy
    # Bound to the host's loopback only: in production the reverse proxy is the way in.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

volumes:
  pgdata:
