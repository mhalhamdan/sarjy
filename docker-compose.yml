services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarjy
      POSTGRES_DB: sarjy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarjy -d sarjy"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sarjy:${POSTGRES_PASSWORD}@db:5432/sarjy
    depends_on:
      db:
        condition: service_healthy
    # Never published publicly: a reverse proxy terminates TLS and forwards here. APP_BIND picks
    # the address. Loopback (the default) suits a proxy on the host. A proxy in its own container
    # reaches the host through the Docker bridge gateway (host.docker.internal), where loopback is
    # invisible, so set APP_BIND=172.17.0.1 for that.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"

volumes:
  pgdata:
